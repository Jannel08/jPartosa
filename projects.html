<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work | Jannel Partosa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Jannel Partosa</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html" class="active">Work</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Selected Projects</h1>
    <p class="lead">A collection of website builds and mobile product work that reflects how I think, design, and ship.</p>

    <!--
      Update this array with your real projects,
      links, and descriptions whenever you're ready.
      Each project can be a website or a mobile app.
    -->
    <div id="projectsGrid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Jannel Partosa. All rights reserved.</p>
      <div class="footer-nav">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    const projects = [
      {
        category: 'Web Development',
        title: 'E-Commerce Product Interface',
        description: 'A fully responsive product page layout featuring custom filtering, clean state transitions, and accessible UI controls.',
        type: 'Website',
        demo: 'https://example.com',
        repo: 'https://github.com/'
      },
      {
        category: 'UI/UX Design',
        title: 'Minimalist Task Dashboard',
        description: 'A lightweight, distraction-free interface concept designed for focus, clarity, and quick daily planning.',
        type: 'Website',
        demo: 'https://example.com',
        repo: 'https://github.com/'
      },
      {
        category: 'Frontend Build',
        title: 'Responsive Portfolio System',
        description: 'A modern static portfolio template built with semantic markup, performance-minded styling, and an easy-to-edit project structure.',
        type: 'Website',
        demo: 'https://example.com',
        repo: 'https://github.com/'
      },
      {
        category: 'Mobile App',
        title: 'FitTrack Mobile App',
        description: 'A mobile-first workout tracker that focuses on quick logging, habit consistency, and offline-friendly activity tracking.',
        type: 'Mobile',
        demo: 'https://play.google.com/',
        repo: 'https://github.com/'
      }
    ];

    const projectsGrid = document.getElementById('projectsGrid');

    projectsGrid.innerHTML = projects.map((project) => `
      <article class="card">
        <div class="card-tag">${project.category}</div>
        <h3>${project.title}</h3>
        <p>${project.description}</p>

        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:auto;">
          <a class="card-link" href="${project.demo}" target="_blank" rel="noopener noreferrer">
            ${project.type === 'Mobile' ? 'View App →' : 'Visit Site →'}
          </a>
          <a class="card-link" href="${project.repo}" target="_blank" rel="noopener noreferrer">
            Source →
          </a>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
